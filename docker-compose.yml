services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: delinquance
      POSTGRES_USER: delinquance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delinquance"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://delinquance:${POSTGRES_PASSWORD:-changeme}@db:5432/delinquance
      PORT: 3000
      NODE_ENV: production
    networks: [internal, web]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.delinquance-api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.delinquance-api.entrypoints=websecure"
      - "traefik.http.routers.delinquance-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.delinquance-api.loadbalancer.server.port=3000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN}/api
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
    restart: unless-stopped
    depends_on: [api]
    networks: [internal, web]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.delinquance-front.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.delinquance-front.entrypoints=websecure"
      - "traefik.http.routers.delinquance-front.tls.certresolver=letsencrypt"
      - "traefik.http.services.delinquance-front.loadbalancer.server.port=3001"

networks:
  internal:
    driver: bridge
    internal: true
  web:
    external: true

volumes:
  db_data:
